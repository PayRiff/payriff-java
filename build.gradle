plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.payriff'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-options']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:none', true)
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.wiremock:wiremock:3.10.0'
}

test {
    useJUnitPlatform()
}

def testJavaVersion = providers.gradleProperty('testJavaVersion')
if (testJavaVersion.isPresent()) {
    tasks.named('test') {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(testJavaVersion.get())
        }
    }
}

jar {
    manifest {
        attributes('Implementation-Title': 'payriff-java', 'Implementation-Version': project.version)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Payriff Java SDK'
                description = 'Java client for the Payriff merchant API'
                url = 'https://github.com/payriff/payriff-java'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                scm {
                    url = 'https://github.com/payriff/payriff-java'
                    connection = 'scm:git:https://github.com/payriff/payriff-java.git'
                }
            }
        }
    }
}